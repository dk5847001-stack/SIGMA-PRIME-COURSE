<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let name = prompt("Enter a name : ");
       if((name[0] === "a" || name[0] === "A") && name.length === 5){
        alert(`${name} is a golden name!`)
       }
       else{
        alert(`${name} is not match our condition, please try another name!`)
       }
    </script>
</body>
</html>
