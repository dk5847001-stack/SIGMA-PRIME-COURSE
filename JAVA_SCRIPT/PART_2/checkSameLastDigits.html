<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let num = prompt("Enter a number");
        if(num[num.length - 1] == 2){
            alert(`The number ${num} , The last digits ends with 2 accepted!`)
        }
        else{
            alert(`The number : ${num}, The last digits is not ends with 2, not accepted!`)
        }
    </script>
</body>
</html>
