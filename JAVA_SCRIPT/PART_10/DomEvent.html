<body>

    <script>
    //    let btn = document.querySelector("button");

        let btns = document.querySelectorAll("button");
        for(btn of btns){
            btn.onmouseenter = function(){
                console.log("Mouse entered button area");
            }
            btn.onclick = clickme;
        }
        function clickme(){
            alert("Button was clicked!");
        }
    </script>
</body>
